apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockdesk
  namespace: default
  labels:
    app: stockdesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stockdesk
  template:
    metadata:
      labels:
        app: stockdesk
    spec:
      containers:
        - name: stockdesk
          image: registry.corvane.example/stockdesk:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
            - name: debug
              containerPort: 9229
          envFrom:
            - secretRef:
                name: stockdesk-env
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: stockdesk
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: stockdesk
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: debug
      port: 9229
      targetPort: debug
