apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockdesk
  namespace: stockdesk
  labels:
    app: stockdesk
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stockdesk
  template:
    metadata:
      labels:
        app: stockdesk
    spec:
      # Don't hand every pod a token that can talk to the Kubernetes API -
      # this app never needs to, so it doesn't get one.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stockdesk
          # IMAGE_TAG is replaced by CI with the git commit SHA of the build
          # being deployed (see .github/workflows/ci.yml), so the image that
          # actually runs is always tied to an exact, auditable commit -
          # never a mutable tag like ":latest".
          image: registry.corvane.example/stockdesk:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            # The Secret itself is created/updated by CI directly in the
            # cluster (see ci.yml) - it is never stored in Git.
            - secretRef:
                name: stockdesk-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # The app writes a small marker file to os.tmpdir() (/tmp) on
            # startup. With readOnlyRootFilesystem true, /tmp needs its own
            # writable volume.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            # The DB check inside /health can take up to ~1s to time out,
            # so give it more headroom than the liveness probe.
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 2
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: stockdesk
  namespace: stockdesk
spec:
  # ClusterIP: only reachable from inside the cluster. No debug port, no
  # direct Internet exposure. See docs/ingress-example.yaml for how
  # suppliers would reach this service once that's decided.
  type: ClusterIP
  selector:
    app: stockdesk
  ports:
    - name: http
      port: 80
      targetPort: http
